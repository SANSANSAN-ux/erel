<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЭРЭЛ — Поручения</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">ЭРЭЛ</a>
        <a href="/">Главная</a>
        <a href="/news-page">Новости</a>
        <a href="/tasks-page">Поручения</a>
        <a href="/bank-page">Банк</a>
    </nav>

    <main class="container">
        <div class="card">
            <h2>Создать поручение</h2>

            <input id="task-title" placeholder="Название">
            <input id="task-description" placeholder="Описание">
            <input id="task-reward" type="number" placeholder="Награда">

            <button onclick="createTask()">Создать</button>
            <p id="task-result"></p>
        </div>

        <div class="card">
            <h2>Все поручения</h2>
            <button onclick="loadTasks()">Обновить</button>
            <div id="tasks"></div>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
